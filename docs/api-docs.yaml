components:
  schemas:
    AddressDto:
      type: object
      description: объект
      properties:
        id:
          type: integer
          format: int32
        street:
          type: string
        zipCode:
          type: string
        town:
          $ref: "#/components/schemas/LocationDto"
    CoordinatesDto:
      type: object
      description: объект
      properties:
        id:
          type: integer
          format: int32
        x:
          type: number
          format: double
        "y":
          type: number
          format: double
      required:
      - id
    LocationDto:
      type: object
      description: объект
      properties:
        id:
          type: integer
          format: int32
        x:
          type: number
          format: float
        "y":
          type: integer
          format: int64
        z:
          type: integer
          format: int64
    OrganizationDto:
      type: object
      description: объект
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        officialAddress:
          $ref: "#/components/schemas/AddressDto"
        annualTurnover:
          type: integer
          format: int32
        employeesCount:
          type: integer
          format: int64
        fullName:
          type: string
        rating:
          type: integer
          format: int32
        type:
          type: string
          enum:
          - COMMERCIAL
          - PUBLIC
          - TRUST
          - OPEN_JOINT_STOCK_COMPANY
    PersonDto:
      type: object
      description: объект
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        eyeColor:
          type: string
          enum:
          - BLUE
          - YELLOW
          - ORANGE
        hairColor:
          type: string
          enum:
          - BLUE
          - YELLOW
          - ORANGE
        location:
          $ref: "#/components/schemas/LocationDto"
        birthday:
          type: string
          format: date-time
        nationality:
          type: string
          enum:
          - USA
          - CHINA
          - VATICAN
          - THAILAND
          - NORTH_KOREA
    ProductDto:
      type: object
      description: объект
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        coordinates:
          $ref: "#/components/schemas/CoordinatesDto"
        creationDate:
          type: string
          format: date-time
        unitOfMeasure:
          type: string
          enum:
          - METERS
          - CENTIMETERS
          - LITERS
          - GRAMS
          - MILLIGRAMS
        organization:
          $ref: "#/components/schemas/OrganizationDto"
        price:
          type: number
          format: double
        manufactureCost:
          type: integer
          format: int32
        rating:
          type: number
          format: float
        partNumber:

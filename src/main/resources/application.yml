##        type:
##          descriptor:
##            sql:
##              BasicBinder: TRACE

springdoc:
  operation-id-template: "{className}_{methodName}"
  api-docs:
    enabled: true
    resolve-schema-properties: true
  swagger-ui:
    operations-sorter: method
  writer-with-default-pretty-printer: true
  override-with-generic-response: false
  default-flat-param-object: true
  cache:
    disabled: true
  group-configs:
    - group: default
      paths-to-match: /**
  paths-to-match: /**

app-config:
  files:
    allowed-formats:
      - csv
      - json